name: CoShulker
main: net.coreviabilisim.coshulker.CoShulkerPlugin
version: '${version}'
api-version: '1.20'
folia-supported: true
authors: [esuhsy]
description: Open shulker boxes straight from your hand.
website: coreviabilisim.net
commands:
  cos:
    description: CoShulker ana komut.
    aliases: [coreviashulker]
    usage: "/cos help"
permissions:
  cos.use:
    description: Havada shulker acma izni.
    default: true
  cos.reload:
    description: Config yenileme izni.
    default: op
